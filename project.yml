# XcodeGen 설정. `xcodegen generate`로 Jupjup.xcodeproj를 만든다(생성물은 git에 안 올림).
# 리포트 키(JJ_SENTRY_DSN, JJ_TELEMETRY_APP_ID)는 build.sh가 report.env에서 읽어 넘긴다.
name: Jupjup
options:
  bundleIdPrefix: com.nemo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: ko

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.0.0
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 3
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ARCHS: "arm64 x86_64"          # Universal
    ONLY_ACTIVE_ARCH: NO
    JJ_SENTRY_DSN: ""
    JJ_TELEMETRY_APP_ID: ""

targets:
  Jupjup:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/Strings
        type: folder
        buildPhase: resources
      - path: Resources/Locales       # <code>.lproj/InfoPlist.strings — 언어별 앱 이름
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: Sentry
        product: Sentry
      - package: TelemetryDeck
        product: TelemetryDeck
    info:
      path: Info.plist
      properties:
        CFBundleName: Jupjup
        CFBundleDisplayName: Jupjup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ko
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        ATSApplicationFontsPath: Fonts
        NSHumanReadableCopyright: ""
        JJSentryDSN: $(JJ_SENTRY_DSN)
        JJTelemetryAppID: $(JJ_TELEMETRY_APP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nemo.jupjup
        PRODUCT_NAME: Jupjup

schemes:
  Jupjup:
    build:
      targets:
        Jupjup: all
