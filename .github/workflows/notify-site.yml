# 릴리스를 내면 소개 사이트(nemodleo/jupjup-web, 비공개)의 sync-release를 바로 돌린다.
# 사이트가 새 릴리스에서 버전·크기·링크·version.json을 다시 만들고 Cloudflare가 배포한다.
# SITE_DISPATCH_TOKEN: jupjup-web 하나에만 Actions 읽기·쓰기 권한을 준 fine-grained 토큰
name: notify-site
on:
  release:
    types: [published]
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nemodleo/jupjup-web/actions/workflows/sync-release.yml/dispatches \
            -d '{"ref":"main"}'
